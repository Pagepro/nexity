# Web stack policy pack.
#
# This pack covers headless CMS platforms, front-end frameworks, ecommerce
# platforms, and web performance. The topics come from a review of 190 blog
# post addresses in a software agency's sitemap.
#
# Post counts from that review, for the gaps that this pack fills:
#   sanity 10, contentful 4, webflow 3, gatsby 3, tailwind 2,
#   storybook 1, graphql 1, shopify 1, saleor 1, astro 1, remix 1,
#   flutter 1, ionic 1, drupal 1, prismic 1, payload 1, amplify 1
# The pack also covers the two topic words with the highest counts:
#   headless 14, jamstack 14.

name: web-stack
version: 1

domains:
  # Headless CMS.
  - { pattern: "www.sanity.io", source_type: official_docs, priority: 30 }
  - { pattern: "sanity.io", source_type: official_docs, priority: 30 }
  - { pattern: "www.contentful.com", source_type: official_docs, priority: 30 }
  - { pattern: "strapi.io", source_type: official_docs, priority: 30 }
  - { pattern: "docs.strapi.io", source_type: official_docs, priority: 32 }
  - { pattern: "www.storyblok.com", source_type: official_docs, priority: 30 }
  - { pattern: "prismic.io", source_type: official_docs, priority: 30 }
  - { pattern: "ghost.org", source_type: official_docs, priority: 30 }
  - { pattern: "payloadcms.com", source_type: official_docs, priority: 30 }
  - { pattern: "directus.io", source_type: official_docs, priority: 30 }
  - { pattern: "www.drupal.org", source_type: official_docs, priority: 30 }

  # Site builders and visual tools.
  - { pattern: "webflow.com", source_type: official_docs, priority: 30 }
  - { pattern: "university.webflow.com", source_type: official_docs, priority: 32 }

  # Component libraries and design systems. An article that compares them
  # needs the vendor page for each one.
  - { pattern: "getbootstrap.com", source_type: official_docs, priority: 30 }
  - { pattern: "mui.com", source_type: official_docs, priority: 30 }
  - { pattern: "chakra-ui.com", source_type: official_docs, priority: 30 }
  - { pattern: "semantic-ui.com", source_type: official_docs, priority: 30 }
  - { pattern: "ant.design", source_type: official_docs, priority: 30 }
  - { pattern: "m3.material.io", source_type: official_docs, priority: 32 }
  - { pattern: "material.io", source_type: official_docs, priority: 30 }
  - { pattern: "fluent2.microsoft.design", source_type: official_docs, priority: 30 }
  - { pattern: "developers.google.com", source_type: official_docs, priority: 32 }
  # Search Console Help is first-party Google documentation. A run blocked the
  # official Rich Results Test page as non-authoritative because this line was
  # absent.
  - { pattern: "support.google.com", source_type: official_docs, priority: 32 }
  - { pattern: "search.google.com", source_type: official_docs, priority: 32 }
  - { pattern: "developer.apple.com", source_type: official_docs, priority: 32 }
  - { pattern: "netflixtechblog.com", source_type: official_blog, priority: 28 }

  # Front-end frameworks and libraries.
  - { pattern: "www.gatsbyjs.com", source_type: official_docs, priority: 30 }
  - { pattern: "astro.build", source_type: official_docs, priority: 30 }
  - { pattern: "docs.astro.build", source_type: official_docs, priority: 32 }
  - { pattern: "remix.run", source_type: official_docs, priority: 30 }
  - { pattern: "nuxt.com", source_type: official_docs, priority: 30 }
  - { pattern: "tailwindcss.com", source_type: official_docs, priority: 30 }
  - { pattern: "storybook.js.org", source_type: official_docs, priority: 30 }
  - { pattern: "redux.js.org", source_type: official_docs, priority: 30 }
  - { pattern: "graphql.org", source_type: standards_body, priority: 30 }
  - { pattern: "www.apollographql.com", source_type: official_docs, priority: 28 }

  # Ecommerce.
  - { pattern: "shopify.dev", source_type: official_docs, priority: 32 }
  - { pattern: "www.shopify.com", source_type: official_blog, priority: 28 }
  - { pattern: "saleor.io", source_type: official_docs, priority: 30 }
  - { pattern: "docs.saleor.io", source_type: official_docs, priority: 32 }
  - { pattern: "medusajs.com", source_type: official_docs, priority: 30 }
  - { pattern: "stripe.com", source_type: official_docs, priority: 28 }

  # Mobile, next to React Native.
  - { pattern: "flutter.dev", source_type: official_docs, priority: 30 }
  - { pattern: "docs.flutter.dev", source_type: official_docs, priority: 32 }
  - { pattern: "ionicframework.com", source_type: official_docs, priority: 30 }

  # Cloud.
  - { pattern: "docs.amplify.aws", source_type: official_docs, priority: 32 }

  # Web performance and standards. A Core Web Vitals claim needs these.
  - { pattern: "web.dev", source_type: official_docs, priority: 30 }
  - { pattern: "developer.chrome.com", source_type: official_docs, priority: 30 }
  - { pattern: "jamstack.org", source_type: industry_source, priority: 25 }
  - { pattern: "httparchive.org", source_type: industry_source, priority: 25 }
  # Usage and market share of a CMS. The vendor states its own share, but the
  # measurement that everyone quotes comes from here.
  - { pattern: "w3techs.com", source_type: industry_source, priority: 25 }

trusted_repo_owners:
  - sanity-io
  - contentful
  - strapi
  - storyblok
  - payloadcms
  - directus
  - gatsbyjs
  - withastro
  - remix-run
  - nuxt
  - tailwindlabs
  - storybookjs
  - reduxjs
  - graphql
  - apollographql
  - Shopify
  - saleor
  - medusajs
  - stripe
  - flutter
  - ionic-team
  - aws-amplify
  - GoogleChrome

subjects:
  sanity:
    aliases: ["sanity", "sanity.io", "sanity studio"]
    domains: ["www.sanity.io", "github.com/sanity-io"]
    direct_urls:
      - "https://www.sanity.io/docs"
      - "https://www.sanity.io/pricing"
