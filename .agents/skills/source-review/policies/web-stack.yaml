  # This subject covers many topics, so it states no direct address. A fixed
  # list of pages cannot serve fourteen different questions: it sent the page
  # experience page to a claim about schema markup. The domain routes the
  # search, and the search finds the page for the claim.
  google search:
    aliases:
      - "google search"
      - "search engine rankings"
      - "search ranking"
      - "ranking signal"
      - "ranking factor"
      - "googlebot"
      - "search console"
      - "google index"
      - "crawl budget"
      - "canonical tag"
      - "sitemap.xml"
      - "robots.txt"
    domains: ["developers.google.com", "support.google.com"]
  page experience:
    aliases: ["page experience", "core web vitals"]
    domains: ["developers.google.com", "web.dev"]
    direct_urls:
      - "https://developers.google.com/search/docs/appearance/page-experience"
  structured data:
    aliases:
      - "structured data"
      - "schema markup"
      - "schema.org"
      - "json-ld"
      - "microdata"
      - "rich result"
      - "rich results"
      - "rich snippet"
      - "rich results test"
    domains: ["developers.google.com", "support.google.com", "schema.org"]
    direct_urls:
