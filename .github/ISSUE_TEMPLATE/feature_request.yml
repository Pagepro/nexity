name: Feature request
description: Suggest a new section, feature or skill.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      multiple: true
      options:
        - base
        - theme-meridian
        - agent layer (.agents/ skills and reviewers)
        - CI / repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the starter or skill do? Features go into both starters unless they are about one starter's look or content.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
