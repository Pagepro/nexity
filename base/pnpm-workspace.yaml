packages:
  - web
  - studio

allowBuilds:
  "@tailwindcss/oxide": true
  "@vercel/speed-insights": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Security overrides for transitive deps (Dependabot). Majors are never forced:
# uuid (<11) and esbuild (vite 7 pins 0.27) are left as-is because forcing them
# breaks their dependents.
overrides:
  lodash: "^4.18.1"
  lodash-es: "^4.18.0"
  ws: "^8.21.0"
  form-data: "^4.0.6"
  "glob@10": "10.5.0"
  "glob@11": "11.1.0"
  "minimatch@5": "5.1.8"
  "minimatch@10": "10.2.3"
  "picomatch@2": "2.3.2"
  "picomatch@4": "4.0.4"
  "@isaacs/brace-expansion": "5.0.1"
  rollup: "^4.59.0"
  "@babel/plugin-transform-modules-systemjs": "7.29.4"
  "tar@7": "^7.5.21"
  valibot: "^1.4.2"
  svgo: "^3.3.5"
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  adm-zip: "^0.6.1"
  "brace-expansion@2": "^2.1.7"
  "brace-expansion@5": "^5.0.12"
  linkify-it: "^5.0.2"
  markdown-it: "^14.3.1"
  dompurify: "^3.4.13"
  fast-uri: "^3.1.8"
  "undici@6": "^6.28.1"
  "undici@7": "^7.29.1"
  ip-address: "^10.7.1"
  hono: "^4.13.5"
  "@hono/node-server": "^1.19.15"
  qs: "^6.16.0"
  "nanoid@3": "^3.3.18"
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
  colord: "^2.9.4"
  smol-toml: "^1.7.1"
  postcss: "^8.5.23"
